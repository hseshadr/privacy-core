# privacy-core — .github/workflows/publish.yml
# npm release of the root package `@edgeproc/privacy-core` via OIDC Trusted Publishing. A
# `v*` tag push is the whole trigger; there is NO npm write token in this repo.
#
# NOTE ON THE PACKAGE NAME: this repo publishes `@edgeproc/privacy-core` (see package.json),
# not `@gainratio/privacy-core`. Register the trusted publisher against the real name.
#
# Two npm truths this caller encodes (see ts-publish.yml):
#   1. The FIRST publish of the name CANNOT use OIDC — npm has no "pending publisher", so
#      the package must already exist to attach one. Do ONE token/OTP `npm publish` by
#      hand, THEN register the trusted publisher in the package settings ({owner,
#      privacy-core, publish.yml}). Every tag push after that runs through here, token-free.
#   2. `provenance` stays FALSE until the repo is PUBLIC — `--provenance` writes a public
#      transparency-log entry and fails on a private repo. Flip it true in the same wave
#      privacy-core goes public. Also add a `repository.url` to package.json (currently
#      absent) that exactly matches the GitHub repo before the first OIDC release, or the
#      publish fails with ENEEDAUTH.
#
# run-gate is FALSE here: the full gate (biome -> tsc -> vitest -> playwright e2e -> build)
# already ran on the merge to main via ci.yml, and its browser e2e step needs a Playwright
# browser that ts-publish deliberately does not provision. This tag flow rebuilds from the
# gated ref and ships. install-args mirrors ci: --frozen-lockfile plus allow-all-builds so
# the Playwright dependency's postinstall is permitted during the pnpm install.
#
# NOTE: hseshadr/ci is referenced at @ci-v2, which is not cut yet (pending). The reusable
# OIDC workflows live on the ci repo's feat/oidc-publish branch until that tag is created.
name: Publish (npm, OIDC)
on:
  push:
    tags: ["v*"]
# Top-level read-only; the OIDC write scope is granted on the publish job only (the ci repo
# security policy forbids a top-level `id-token: write`).
permissions:
  contents: read
jobs:
  publish:
    permissions:
      id-token: write # OIDC — npm verifies this against the registered trusted publisher.
      contents: read
    uses: hseshadr/ci/.github/workflows/ts-publish.yml@ci-v2
    with:
      working-directory: "."
      install-args: "--frozen-lockfile --config.dangerously-allow-all-builds=true"
      run-gate: false
      provenance: false # flip true only when the repo is public
