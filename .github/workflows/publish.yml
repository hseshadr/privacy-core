name: Publish (npm, OIDC)

on:
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact Dagger candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: privacy-core-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/privacy-core@${{ github.event.workflow_run.head_sha }}
          args: >-
            publish --candidate=release
            --expected-sha=${{ github.event.workflow_run.head_sha }}
            --oidc-url=env:ACTIONS_ID_TOKEN_REQUEST_URL
            --oidc-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
