name: Publish (npm, OIDC)

# npm trusted publishing is bound to this workflow FILENAME (publish.yml).
# Renaming it silently breaks every future release.

on:
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact Dagger candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: privacy-core-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      # CLI setup only. dagger-for-github pastes its `args`/`call` into bash
      # unquoted, so the publish call runs below with every value quoted.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
      # npm only generates provenance (and only attempts the OIDC exchange) when
      # it can see this run's GitHub Actions context, which does not reach a
      # Dagger container on its own. It is handed over as a file, outside the
      # release/ candidate, and the Dagger publisher validates every value.
      - name: Record the GitHub Actions provenance context
        shell: bash
        run: >-
          jq -n '{
          GITHUB_EVENT_NAME: env.GITHUB_EVENT_NAME,
          GITHUB_REF: env.GITHUB_REF,
          GITHUB_REPOSITORY: env.GITHUB_REPOSITORY,
          GITHUB_REPOSITORY_ID: env.GITHUB_REPOSITORY_ID,
          GITHUB_REPOSITORY_OWNER_ID: env.GITHUB_REPOSITORY_OWNER_ID,
          GITHUB_RUN_ATTEMPT: env.GITHUB_RUN_ATTEMPT,
          GITHUB_RUN_ID: env.GITHUB_RUN_ID,
          GITHUB_SERVER_URL: env.GITHUB_SERVER_URL,
          GITHUB_SHA: env.GITHUB_SHA,
          GITHUB_WORKFLOW: env.GITHUB_WORKFLOW,
          GITHUB_WORKFLOW_REF: env.GITHUB_WORKFLOW_REF,
          RUNNER_ENVIRONMENT: env.RUNNER_ENVIRONMENT
          }' > github-context.json
      - name: Publish exact Dagger candidate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          dagger --progress plain call -m "github.com/hseshadr/privacy-core@$HEAD_SHA"
          publish --candidate=release --expected-sha="$HEAD_SHA"
          --oidc-url=env:ACTIONS_ID_TOKEN_REQUEST_URL --oidc-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
          --github-context=github-context.json
