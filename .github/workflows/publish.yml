name: Publish (npm, OIDC)

on:
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact Dagger candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: privacy-core-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/privacy-core@${{ github.event.workflow_run.head_sha }}
          args: >-
            publish --candidate=release
            --expected-sha=${{ github.event.workflow_run.head_sha }}
            --oidc-url=env:ACTIONS_ID_TOKEN_REQUEST_URL
            --oidc-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
