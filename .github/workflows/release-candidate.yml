name: Dagger release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag identifying exact current main
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Dagger release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      # The dispatched tag is attacker-shapeable text. It reaches shell only as
      # the TAG environment variable, and only after this first step proves it
      # is a plain vX.Y.Z; no `${{ inputs.* }}` expression is ever pasted into
      # script text or into an action's shell-templated inputs.
      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the tag input must be a plain vX.Y.Z release tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Install only. dagger-for-github pastes its `args`/`call` into bash
      # unquoted, so the release call runs in the next step with every value
      # quoted.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
      - name: Build Dagger release candidate
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dagger --progress plain call
          release-candidate --tag="$TAG" --commit-sha="$GITHUB_SHA"
          --github-token=env:GITHUB_TOKEN export --path=release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privacy-core-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1
