name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # dangerously-allow-all-builds lets the trusted toolchain binaries
        # (biome, esbuild) build non-interactively in CI.
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Gate (the exact local command — §3 CI mirrors the gate)
        run: pnpm gate

  # Full-history secret scan, via the shared brick in hseshadr/ci — where the
  # mechanics and their rationale now live. One maintained copy of this control
  # instead of an inlined duplicate that drifts: the brick also sets
  # persist-credentials: false, which this inlined copy was missing.
  gitleaks:
    name: Secret scan
    # gitleaks-action lists the PR's commits via the API on pull_request events;
    # without pull-requests: read it 403s ("Resource not accessible by
    # integration"). The workflow-level `contents: read` does not grant it, and a
    # caller job may raise a scope the read-only top level withholds.
    permissions:
      contents: read
      pull-requests: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
